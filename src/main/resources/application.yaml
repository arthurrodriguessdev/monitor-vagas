spring:
  application:
    name: monitor-vagas
  mail:
    nomeRemetente: ${EMAIL_REMETENTE}
    username: ${EMAIL_USERNAME}
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    enable: true
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${APPLICATION_PORT}
url:
  gupy: ${URL_GUPY_VAGAS}
  infojobs: ${URL_INFOJOBS_VAGAS}
  catho: ${URL_CATHO_VAGAS}
  thor: ${URL_THOR_VAGAS}
secretKeyJwt: ${SECRET_KEY_JWT}
